name=OttoI2R
version=1.0.0
author=i2r
maintainer=i2r <kdi6033@gmail.com>
sentence=Control library for the Otto I2R robot: walking, rolling and sliding with four servos on ESP32-S3.
paragraph=Drives the four servos (YL, YR, RL, RR) with the ESP32 LEDC PWM, so no extra library is needed. Includes walking, sliding and rolling motions with adjustable speed, and loads the calibration saved on the board (set from the Otto web page) with a single ottoInit() call. Requires the ESP32 board package 3.0 or later.
category=Device Control
url=https://github.com/kdi6033/OttoI2R
architectures=esp32
includes=OttoI2R.h
